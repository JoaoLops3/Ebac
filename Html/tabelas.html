<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>  <!-- é o container da Tabela -->
        <caption>Notas em matemática</caption> <!-- utilizada para inserir uma legenda para a tabela -->
        <thead> <!-- utilizada para construir o cabeçalho da tabela -->
            <tr> <!-- utilizada para construir uma linha na tabela -->
                <th>Nome do aluno</th> <!-- th - utilizada para construir uma coluna no cabeçalho da tabela, texto fica negrito -->
                <th>Nota do aluno</th>
            </tr>
        </thead>
        <tbody>  <!-- utilizada para construir o corpo da tabela -->
            <tr>
                <td>Aluno A</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Aluno B</td>
                <td>7</td>
            </tr>
        </tbody>
        <tfoot>  <!-- utilizada para construir o rodapé da tabela -->
            <tr>
                <td>Média</td>
                <td>7.5</td>
        </tfoot>
    </table>
</body>
</html>
